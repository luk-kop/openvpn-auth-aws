name: CI

on:
  push:
    branches-ignore:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Lint daemon
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version

      - name: Vet daemon
        run: go vet ./...

      - name: Lint Lambda Router
        uses: golangci/golangci-lint-action@v9
        with:
          # Relative to working-directory, not the repository root.
          version-file: ../.golangci-lint-version
          working-directory: lambda-router

      - name: Vet Lambda Router
        run: cd lambda-router && go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Test daemon
        run: go test -v -short ./...

      - name: Test Lambda Router
        run: cd lambda-router && go test -v -short ./...

  race-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Race test both Go modules
        run: make race-test

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Scan both Go modules for reachable vulnerabilities
        run: make vulncheck

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, race-test, vulncheck]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Build daemon binaries
        run: make build

      - name: Build Lambda Router
        run: make build-lambda
